<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#22c4ff">
<title>Laguna Aero Isola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Hind:wght@400;600&display=swap">
<style>
/* Layout: gioco a schermo intero; HUD di vetro in alto, joystick in basso a sinistra, azioni in basso a destra */
:root{
  --ink:#0b2a4a; --ink-soft:#3d6185; --aqua:#22c4ff; --aqua-deep:#0a7fd6; --glass:rgba(255,255,255,.7); --edge:rgba(255,255,255,.95);
  --display:"Varela Round","Trebuchet MS",system-ui,sans-serif; --body:"Hind","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#9fdcff;color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.88),rgba(220,245,255,.62));border:1px solid var(--edge);
  box-shadow:0 6px 20px rgba(0,60,130,.22),inset 0 1px 0 #fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;pointer-events:none}
.pill{font-family:var(--display);font-size:14px;padding:7px 13px;border-radius:999px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.pill b{font-weight:400;color:var(--aqua-deep);font-variant-numeric:tabular-nums}
.quest{flex:1 1 240px;min-width:0;font-family:var(--display);font-size:14px;padding:8px 14px;border-radius:18px;white-space:normal}
.quest small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.mood{width:64px;height:8px;border-radius:9px;background:rgba(10,60,120,.15);overflow:hidden}
.mood i{display:block;height:100%;width:60%;border-radius:9px;background:linear-gradient(90deg,#ff7ab0,#ffb3d1);transition:width .4s}
.topbtns{display:flex;gap:6px;pointer-events:auto}
.btn{font-family:var(--display);font-size:14px;border:1px solid var(--edge);border-radius:999px;padding:8px 14px;cursor:pointer;color:#fff;
  text-shadow:0 1px 1px rgba(0,60,120,.45);background:linear-gradient(180deg,#9ae6ff 0%,#2cb8f2 48%,#0a8fdb 52%,#3ccaff 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 4px 12px rgba(0,110,200,.3)}
.btn.ghost{color:var(--ink);text-shadow:none;background:linear-gradient(180deg,#fff,#e2f6ff 50%,#cfeeff 52%,#eefaff)}
.btn:focus-visible,input:focus-visible{outline:3px solid #ffd447;outline-offset:2px}
.btn[aria-pressed="true"]{background:linear-gradient(180deg,#c0ffd8,#3fd27a 48%,#1fae5a 52%,#5be496);color:#fff}

.stick{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:140px;height:140px;border-radius:50%;touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff 0 14%,#9ff0ff 35%,#19b2ef 70%,#0767b5);box-shadow:0 0 0 2px #fff,0 6px 16px rgba(0,100,200,.4)}
.actions{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.act{width:76px;height:76px;border-radius:50%;padding:0;font-size:13px;display:grid;place-items:center;line-height:1.1;text-align:center}
.act.big{width:96px;height:96px;font-size:15px}
.row{display:flex;gap:10px;align-items:flex-end}

.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.35),rgba(10,70,140,.35))}
.card{width:min(460px,100%);border-radius:28px;padding:24px 22px;display:flex;flex-direction:column;gap:14px;text-align:center}
.card h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,44px);margin:0;color:var(--aqua-deep);text-wrap:balance}
.card p{margin:0;font-size:16px;line-height:1.5;color:var(--ink-soft)}
.card label{font-family:var(--display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.card input{font:inherit;font-size:20px;text-align:center;padding:12px;border-radius:18px;border:1px solid #fff;background:rgba(255,255,255,.9);color:var(--ink);box-shadow:inset 0 2px 6px rgba(10,60,120,.12)}
.hint{font-size:13px!important}

.talk{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(620px,calc(100% - 32px));border-radius:24px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.talk .who{font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--aqua-deep)}
.talk .say{font-size:17px;line-height:1.5;min-height:1.5em;max-height:30vh;overflow-y:auto}
.talk form{display:flex;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.btn.chip{font-size:14px;padding:7px 12px}
.talk input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 14px;border-radius:18px;border:1px solid #fff;background:rgba(255,255,255,.9);color:var(--ink)}
.toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(18px,3.4vw,26px);padding:12px 22px;border-radius:22px;text-align:center;max-width:calc(100% - 32px);transition:opacity .5s,transform .5s;pointer-events:none}
.toast.off{opacity:0;transform:translate(-50%,-30%)}
.err{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-family:var(--display);font-size:18px;color:var(--ink)}
.talking .stick,.talking .actions{display:none}
@media (max-width:600px){.act{width:64px;height:64px;font-size:12px}.act.big{width:80px;height:80px}.stick{width:120px;height:120px}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>

<canvas id="game" aria-label="Isola di Laguna Aero in 3D"></canvas>

<div class="hud">
  <div class="pill glass">Gocce <b id="dropCount">0/10</b></div>
  <div class="pill glass"><span id="petLabel">Pet</span><span class="mood" aria-label="Felicità del pet"><i id="moodBar"></i></span></div>
  <div class="quest glass"><small>Obiettivo</small><span id="questText">Parla con VEGA nel padiglione di vetro</span></div>
  <div class="topbtns">
    <button class="btn ghost" id="timeBtn" type="button">Notte</button>
    <button class="btn ghost" id="musicBtn" type="button" aria-pressed="false">Musica</button>
  </div>
</div>

<div class="stick glass" id="stick" aria-label="Joystick: trascina per camminare"><div class="knob" id="knob"></div></div>
<div class="actions">
  <button class="btn act ghost" id="petBtn" type="button" hidden>Accarezza</button>
  <div class="row">
    <button class="btn act" id="talkBtn" type="button" hidden>Parla</button>
    <button class="btn act big" id="jumpBtn" type="button">Salta</button>
  </div>
</div>

<div class="talk glass" id="talk" hidden role="dialog" aria-label="Dialogo con VEGA">
  <div class="who">VEGA</div>
  <div class="say" id="say" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="talkForm">
    <input id="talkInput" autocomplete="off" placeholder="Rispondi a VEGA…" aria-label="Risposta a VEGA">
    <button class="btn" type="submit" id="talkSend">Invia</button>
    <button class="btn ghost" type="button" id="talkClose">Chiudi</button>
  </form>
</div>

<div class="toast glass off" id="toast" role="status"></div>

<div class="overlay" id="intro">
  <div class="card glass">
    <h1>Laguna Aero</h1>
    <p>Un'isola di vetro nel mare tropicale. Il tuo compagno robot ti aspetta.</p>
    <label for="petName">Come si chiama il tuo pet?</label>
    <input id="petName" maxlength="14" value="Lumo">
    <button class="btn" id="startBtn" type="button">Gioca</button>
    <p class="hint">Joystick per camminare · trascina sullo schermo per girare la visuale</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
if (!window.THREE) { document.body.insertAdjacentHTML("beforeend",'<div class="err glass">Il motore 3D non si è caricato. Controlla la connessione e ricarica la pagina.</div>'); return; }
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const SAVE = "laguna-aero-3d-v1";
let save = {pet:"Lumo",drops:[],stage:0,mood:.6,droneCaught:false,vegaRecent:[]};

try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE))||{}); delete save.talks; } catch(e){}
function persist(){ try{ localStorage.setItem(SAVE, JSON.stringify(save)); }catch(e){} }

/* ================= renderer / scene ================= */
const canvas=$("game");
let renderer;
try { renderer = new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:"high-performance",stencil:false}); }
catch(e){ document.body.insertAdjacentHTML("beforeend",'<div class="err glass">Questo dispositivo non riesce ad avviare il 3D.</div>'); return; }
const DPR_MAX=Math.min(window.devicePixelRatio||1,2);
let pixelRatio=DPR_MAX;
renderer.setPixelRatio(pixelRatio);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(58,1,.1,900);
// i colori scritti in esadecimale sono "sRGB": li convertiamo in lineare per una luce corretta
const lin=c=>new THREE.Color(c).convertSRGBToLinear();

/* ================= post-processing: bagliore (bloom) + tone mapping finale ================= */
let composer=null,bloom=null,finalPass=null;
(function setupPost(){
  try{
    if(!THREE.EffectComposer||!THREE.UnrealBloomPass||!THREE.ShaderPass||!renderer.capabilities.isWebGL2)return;
    const gl=renderer.getContext();
    if(!gl.getExtension("EXT_color_buffer_float")&&!gl.getExtension("EXT_color_buffer_half_float"))return;
    const RT=THREE.WebGLMultisampleRenderTarget||THREE.WebGLRenderTarget;
    const rt=new RT(innerWidth,innerHeight,{type:THREE.HalfFloatType,format:THREE.RGBAFormat,minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter});
    if(rt.isWebGLMultisampleRenderTarget)rt.samples=4;
    composer=new THREE.EffectComposer(renderer,rt);
    composer.addPass(new THREE.RenderPass(scene,camera));
    bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.5,.55,2.2);
    composer.addPass(bloom);
    finalPass=new THREE.ShaderPass({
      uniforms:{tDiffuse:{value:null},exposure:{value:1},vig:{value:.22},sat:{value:1.1}},
      vertexShader:"varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}",
      fragmentShader:`uniform sampler2D tDiffuse;uniform float exposure,vig,sat;varying vec2 vUv;
      vec3 fit(vec3 v){vec3 a=v*(v+0.0245786)-0.000090537;vec3 b=v*(0.983729*v+0.4329510)+0.238081;return a/b;}
      vec3 aces(vec3 c){const mat3 i=mat3(0.59719,0.07600,0.02840,0.35458,0.90834,0.13383,0.04823,0.01566,0.83777);
        const mat3 o=mat3(1.60475,-0.10208,-0.00327,-0.53108,1.10813,-0.07276,-0.07367,-0.00605,1.07602);
        c*=exposure/0.6;return clamp(o*fit(i*c),0.,1.);}
      vec3 srgb(vec3 c){return mix(c*12.92,1.055*pow(c,vec3(1./2.4))-.055,step(.0031308,c));}
      void main(){vec3 c=aces(texture2D(tDiffuse,vUv).rgb);
        float l=dot(c,vec3(.2126,.7152,.0722));c=max(mix(vec3(l),c,sat),0.);
        vec2 d=vUv-.5;c*=1.-vig*dot(d,d)*1.6;c=srgb(clamp(c,0.,1.));
        c+=(fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453)-.5)/255.;
        gl_FragColor=vec4(c,1.);}`
    });
    composer.addPass(finalPass);
  }catch(e){composer=null;}
})();
function resize(){const w=innerWidth,h=innerHeight;renderer.setPixelRatio(pixelRatio);renderer.setSize(w,h,false);
  if(composer){composer.setPixelRatio(pixelRatio);composer.setSize(w,h);}
  camera.aspect=w/h;camera.fov=w<h?68:56;camera.updateProjectionMatrix();}
addEventListener("resize",resize); resize();

/* ================= sky ================= */
const skyU={top:{value:new THREE.Color()},bottom:{value:new THREE.Color()},glow:{value:new THREE.Color()},cloud:{value:new THREE.Color()},
  sunDir:{value:new THREE.Vector3(.4,.5,-.6).normalize()},sunCol:{value:new THREE.Color()},night:{value:0},time:{value:0}};
const skyMat=new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,
  vertexShader:"varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}",
  fragmentShader:`uniform vec3 top,bottom,glow,cloud,sunCol,sunDir;uniform float night,time;varying vec3 vP;
  float h(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,45.164)))*43758.5453);}
  float h2(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
  float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
    return mix(mix(h2(i),h2(i+vec2(1,0)),f.x),mix(h2(i+vec2(0,1)),h2(i+1.),f.x),f.y);}
  float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*n2(p);p=p*2.03+7.1;a*=.5;}return v;}
  void main(){vec3 d=normalize(vP);
    float t=clamp(d.y,0.,1.);vec3 c=mix(bottom,top,pow(t,.4));
    float sd=max(dot(d,sunDir),0.);
    c+=glow*exp(-max(d.y,0.)*5.)*(.3+.7*pow(sd,3.));
    if(d.y<0.)c=mix(bottom,bottom*.6,clamp(-d.y*4.,0.,1.));
    c+=sunCol*(smoothstep(.9993,.9996,sd)*14.+pow(sd,90.)*.9+pow(sd,10.)*.18);
    if(d.y>0.){vec2 uv=d.xz/(d.y+.15)*1.3+vec2(time*.010,time*.004);
      float cl=smoothstep(.52,.82,fbm(uv))*smoothstep(0.,.2,d.y);
      vec3 cc=cloud*(.85+.35*pow(sd,4.))+sunCol*pow(sd,5.)*.5;
      c=mix(c,cc,cl*.8);}
    vec3 q=d*320.;vec3 f=fract(q)-.5;float r=h(floor(q));
    float st=step(.9972,r)*smoothstep(.45,.05,length(f))*(.55+.45*sin(time*2.3+r*80.));
    c+=vec3(.85,.92,1.)*st*night*smoothstep(.02,.25,d.y)*2.;
    gl_FragColor=vec4(c,1.);
    #include <tonemapping_fragment>
    #include <encodings_fragment>
  }`});
const sky=new THREE.Mesh(new THREE.SphereGeometry(500,32,16),skyMat);
sky.frustumCulled=false;scene.add(sky);
scene.fog=new THREE.Fog(0xffffff,80,300);

// luce: un sole che fa ombre nitide + una luce ambiente morbida che viene dal cielo
const hemi=new THREE.HemisphereLight(0xffffff,0xffffff,.3); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-30,right:30,top:30,bottom:-30,near:1,far:160}); sun.shadow.bias=-.0004; sun.shadow.normalBias=.03;
scene.add(sun); scene.add(sun.target);

/* riflessi: una "fotografia a 360°" del cielo che vetro, cromo e plastica riflettono */
const pmrem=new THREE.PMREMGenerator(renderer);
const envScene=new THREE.Scene();
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(80,32,16),skyMat));
const envGround=new THREE.Mesh(new THREE.CircleGeometry(70,32),new THREE.MeshBasicMaterial({color:0xffffff}));
envGround.rotation.x=-Math.PI/2;envGround.position.y=-4;envScene.add(envGround);
// pannelli luminosi morbidi: creano le strisce di luce tipiche del cromo Frutiger Aero
const envPanelMat=new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide});
for(let i=0;i<4;i++){const p=new THREE.Mesh(new THREE.PlaneGeometry(18,4),envPanelMat);const a=i/4*Math.PI*2+.4;
  p.position.set(Math.cos(a)*40,22,Math.sin(a)*40);p.lookAt(0,0,0);envScene.add(p);}
let envRT=null,envK=-9,envT=-9;
function updateEnv(k,force){
  if(!force&&(Math.abs(k-envK)<.04||performance.now()-envT<250))return;
  envK=k;envT=performance.now();
  envGround.material.color.copy(lin("#9cc28a")).lerp(lin("#0b1a33"),Math.min(1,k));
  envPanelMat.color.setScalar(1.6*(1-.85*Math.min(1,k)));
  const rt=pmrem.fromScene(envScene,0,.1,200);if(envRT)envRT.dispose();envRT=rt;scene.environment=rt.texture;
}

/* ================= terrain ================= */
const R_ISLAND=50;
const smooth=t=>t*t*(3-2*t);
function height(x,z){
  const r=Math.hypot(x,z); if(r>R_ISLAND+8) return -3;
  const t=Math.min(1,Math.max(0,(R_ISLAND+8-r)/16));
  let y=-3+4.2*smooth(t);
  const inner=Math.min(1,Math.max(0,(40-r)/10));
  y+=inner*(Math.sin(x*.07)*Math.cos(z*.06)*1.1+Math.sin(x*.21+z*.13)*.25);
  // flatten pads for buildings
  [[0,-14,11],[20,12,8.5]].forEach(([px,pz,pr])=>{const d=Math.hypot(x-px,z-pz);if(d<pr+4){const k=smooth(Math.min(1,Math.max(0,(pr+4-d)/4)));y=y*(1-k)+1.25*k;}});
  return y;
}
{
  const g=new THREE.PlaneGeometry(140,140,140,140); g.rotateX(-Math.PI/2);
  const pos=g.attributes.position, col=[];
  const sand=lin("#f6e7c4"),sand2=lin("#efd9a8"),grass=lin("#7fdc6a"),grass2=lin("#3fb45a"),wet=lin("#c9b083"),sea=lin("#9fd8cf");
  for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i),y=height(x,z);pos.setY(i,y);
    const nz=(Math.sin(x*1.7+z*.3)*Math.cos(z*1.3-x*.4)+1)*.5;
    let c; if(y<-.4) c=sea.clone().lerp(wet,Math.max(0,(y+3)/2.6)); else if(y<.2) c=wet.clone().lerp(sand2,(y+.4)/.6);
    else if(y<1.0) c=sand.clone().lerp(sand2,nz*.5);
    else {c=grass.clone().lerp(grass2,(Math.sin(x*.3)*Math.cos(z*.25)+1)*.3+nz*.25); if(y<1.25) c.lerp(sand,(1.25-y)*3);}
    col.push(c.r,c.g,c.b);}
  g.setAttribute("color",new THREE.Float32BufferAttribute(col,3)); g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.95,envMapIntensity:.4}));
  m.receiveShadow=true; scene.add(m);
}

/* ================= water ================= */
// acqua: onde in più direzioni, riflesso del cielo, scintillii del sole, riflessi sul fondale, schiuma e (di notte) plancton luminoso
const waterU={time:{value:0},deep:{value:new THREE.Color()},shallow:{value:new THREE.Color()},hor:{value:new THREE.Color()},
  sunDir:skyU.sunDir,sunCol:skyU.sunCol,skyTop:skyU.top,skyBot:skyU.bottom,night:skyU.night,shoreR:{value:47.5}};
const water=new THREE.Mesh(new THREE.PlaneGeometry(1000,1000,1,1),new THREE.ShaderMaterial({uniforms:waterU,transparent:true,depthWrite:false,
  vertexShader:"varying vec3 vW;void main(){vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}",
  fragmentShader:`uniform float time,night,shoreR;uniform vec3 deep,shallow,hor,sunDir,sunCol,skyTop,skyBot;varying vec3 vW;
  float h2(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
  float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
    return mix(mix(h2(i),h2(i+vec2(1,0)),f.x),mix(h2(i+vec2(0,1)),h2(i+1.),f.x),f.y);}
  vec2 wave(vec2 p,vec2 d,float f,float a,float s){d=normalize(d);return d*f*a*cos(dot(d,p)*f+time*s);}

   deep:"#02143c",shallow:"#08587e",lamp:3.5,neon:7,exp:.8,bloomS:1.0,bloomT:.7,sat:1.1,dir:[.35,.5,-.8]}
].map(p=>{const o={};for(const k in p)o[k]=typeof p[k]==="string"?lin(p[k]):Array.isArray(p[k])?new THREE.Vector3(...p[k]).normalize():p[k];return o;});
let phase=0,isNight=false,tod=0;
const _c=new THREE.Color(),_v=new THREE.Vector3();
function applyTod(k){
  const i=Math.min(1,Math.floor(k)),f=k-i,A=PH[i],B=PH[i+1];
  const col=key=>_c.copy(A[key]).lerp(B[key],f);const num=key=>A[key]+(B[key]-A[key])*f;
  skyU.top.value.copy(col("top"));skyU.bottom.value.copy(col("bottom"));skyU.glow.value.copy(col("glow"));skyU.cloud.value.copy(col("cloud"));
  skyU.sunCol.value.copy(col("sun"));skyU.night.value=Math.max(0,k-1);
  skyU.sunDir.value.copy(_v.copy(A.dir).lerp(B.dir,f).normalize());
  sun.color.copy(col("sun"));sun.intensity=num("sunI");
  hemi.color.copy(col("hs"));hemi.groundColor.copy(col("hg"));hemi.intensity=num("hemi");
  scene.fog.color.copy(col("fog"));waterU.hor.value.copy(scene.fog.color);waterU.deep.value.copy(col("deep"));waterU.shallow.value.copy(col("shallow"));
  lamps.forEach(l=>l.material.emissiveIntensity=num("lamp"));M.neon.emissiveIntensity=num("neon");
  renderer.toneMappingExposure=num("exp");
  if(bloom){bloom.strength=num("bloomS");bloom.threshold=num("bloomT");}
  if(finalPass){finalPass.uniforms.exposure.value=num("exp");finalPass.uniforms.sat.value=num("sat");}
  updateEnv(k);
}

let ac=null,master=null,musicTimer=null;
function audioInit(){if(ac)return;try{ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.7;master.connect(ac.destination);}catch(e){ac=null;}}
function tone(f,t,d,v,type,dest){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+d+.05);return o;}
function sfx(k){if(!ac)return;const t=ac.currentTime;
  if(k==="drop"){[1046,1318,1568,2093].forEach((f,i)=>tone(f,t+i*.07,.5,.12));}
  else if(k==="bark"){const o=tone(900,t,.12,.1,"square");if(o)o.frequency.exponentialRampToValueAtTime(1400,t+.08);const o2=tone(1100,t+.15,.12,.1,"square");if(o2)o2.frequency.exponentialRampToValueAtTime(1700,t+.23);}
  else if(k==="jump"){const o=tone(420,t,.2,.08,"triangle");if(o)o.frequency.exponentialRampToValueAtTime(820,t+.15);}
  else if(k==="pet"){[660,880,990].forEach((f,i)=>tone(f,t+i*.09,.35,.09,"triangle"));}
  else if(k==="vega"){[1568,2093].forEach((f,i)=>tone(f,t+i*.06,.12,.04,"sine"));}
  else if(k==="win"){[523,659,784,1046,1318].forEach((f,i)=>tone(f,t+i*.12,.9,.12));}}

const hz=m=>440*Math.pow(2,(m-69)/12);
$("musicBtn").onclick=e=>{audioInit();if(!ac)return;const b=e.currentTarget;

  const delay=ac.createDelay();delay.delayTime.value=.38;const fb=ac.createGain();fb.gain.value=.3;delay.connect(fb).connect(delay);delay.connect(master);
  let bar=0;const step=()=>{const t=ac.currentTime+.05;const c=CH[(bar+(Math.random()<.25?2:0))%CH.length];bar=(bar+1)%CH.length;
    c.forEach(m=>tone(hz(m-12),t,3.6,.03,"triangle"));for(let i=0;i<6;i++)if(Math.random()<.7)tone(hz(c[(Math.random()*4)|0]+12),t+i*.6,1.2,.035,"sine",delay);};

const vegaBag={};
function vegaPick(name,arr){
  // sceglie a caso evitando le frasi dette di recente
  const recent=save.vegaRecent||(save.vegaRecent=[]);
  let pool=arr.filter(l=>!recent.includes(l));
  if(!pool.length){pool=arr.filter(l=>l!==recent[recent.length-1]);if(!pool.length)pool=arr;}
  const line=pool[Math.random()*pool.length|0];
  recent.push(line);save.vegaRecent=recent.slice(-30);return line;
}
function fillLine(l){const n=save.drops.length;return l.replace(/\{pet\}/g,save.pet).replace(/\{n\}/g,n).replace(/\{left\}/g,10-n);}
function vegaGroup(name){
  if(name==="progress"){const n=save.drops.length;

    return n===0?VEGA_LINES.collectingNone:VEGA_LINES.collecting;}

// risposta a quello che scrive Brenda
function vegaReply(text){
  const t=" "+text.toLowerCase()+" ";const petRe=save.pet.toLowerCase();
  for(const topic of VEGA_TOPICS){
    const re=new RegExp(topic.k.source.replace("PETNAME",petRe.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")));
    if(re.test(t)){
      const name="topic:"+topic.k.source;
      const line=typeof topic.lines==="string"?vegaLine(topic.lines):fillLine(vegaPick(name,topic.lines));
      return {say:line,action:topic.action||null};
    }
  }
  return {say:vegaLine("unknown")+" "+vegaLine("facts"),action:null};
}

/* ================= collisions ================= */
function collide(x,z){
  let r=Math.hypot(x,z);if(r>R_ISLAND-1){x*=(R_ISLAND-1)/r;z*=(R_ISLAND-1)/r;}
  // dome solid
  let dx=x-DOME.x,dz=z-DOME.z,d=Math.hypot(dx,dz);if(d<DOME_R+.8){x=DOME.x+dx/d*(DOME_R+.8);z=DOME.z+dz/d*(DOME_R+.8);}
  // pavilion glass ring with door facing +z
  dx=x-PAV.x;dz=z-PAV.z;d=Math.hypot(dx,dz);const ang=Math.atan2(dx,dz);
  if(Math.abs(d-PAV_R)<.7&&Math.abs(ang)>Math.PI*.12){const tgt=d<PAV_R?PAV_R-.7:PAV_R+.7;x=PAV.x+dx/d*tgt;z=PAV.z+dz/d*tgt;}
  // counter
  dx=x-PAV.x;dz=z-(PAV.z-3.2);d=Math.hypot(dx,dz);if(d<4.9&&dz>-1&&Math.abs(Math.atan2(dx,dz))<Math.PI*.6){x=PAV.x+dx/d*4.9;z=PAV.z-3.2+dz/d*4.9;}
  dx=x-vega.position.x;dz=z-vega.position.z;d=Math.hypot(dx,dz);if(d<1.1){x=vega.position.x+dx/d*1.1;z=vega.position.z+dz/d*1.1;}
  return [x,z];
}
function groundAt(x,z){const dp=Math.hypot(x-PAV.x,z-PAV.z);if(dp<PAV_R+.4)return PAV.y+.2;return Math.max(height(x,z),-.6);}

  const dt=Math.min(clock.getDelta(),.05);T+=dt;
  // time of day
  {const d=phase-tod;if(Math.abs(d)>.001){tod+=Math.sign(d)*Math.min(Math.abs(d),dt*.7);applyTod(tod);}}
  skyU.time.value=T;
  waterU.time.value=T;

  // player movement
  let ix=sx,iz=sy;if(keys.w||keys.arrowup)iz-=1;if(keys.s||keys.arrowdown)iz+=1;if(keys.a||keys.arrowleft)ix-=1;if(keys.d||keys.arrowright)ix+=1;
  const mag=Math.min(1,Math.hypot(ix,iz));const talking=!$("talk").hidden;
  if(mag>.08&&!talking){const a=Math.atan2(ix,iz)+camYaw+Math.PI;const sp=7.2*mag;
    let nx=ps.x+Math.sin(a)*sp*dt,nz=ps.z+Math.cos(a)*sp*dt;[nx,nz]=collide(nx,nz);ps.x=nx;ps.z=nz;
    let diff=a-ps.yaw;diff=Math.atan2(Math.sin(diff),Math.cos(diff));ps.yaw+=diff*Math.min(1,dt*12);ps.speed=sp;}
  else ps.speed*=.8;
  const gy=groundAt(ps.x,ps.z);ps.vy-=22*dt;ps.y+=ps.vy*dt;if(ps.y<=gy){ps.y=gy;ps.vy=0;ps.grounded=true;}
  player.position.set(ps.x,ps.y,ps.z);player.rotation.y=ps.yaw;
  const walk=ps.grounded?Math.min(1,ps.speed/6):0,ph=T*11;
  legs[0].rotation.x=Math.sin(ph)*.7*walk;legs[1].rotation.x=-Math.sin(ph)*.7*walk;arms[0].rotation.x=-Math.sin(ph)*.6*walk;arms[1].rotation.x=Math.sin(ph)*.6*walk;
  player.position.y+=Math.abs(Math.sin(ph))*.08*walk+Math.sin(T*2)*.01;
  if(!ps.grounded){arms[0].rotation.z=-.6;arms[1].rotation.z=.6;}else{arms[0].rotation.z=arms[1].rotation.z=0;}

  // drops
  drops.forEach(d=>{if(!d.visible)return;d.position.y=d.userData.base+Math.sin(T*2+d.userData.i)*.25;d.rotation.y+=dt*1.5;d.userData.ring.rotation.x=T*1.2;d.userData.ring.rotation.y=T*.8;
    if(Math.hypot(d.position.x-ps.x,d.position.z-ps.z)<1.6&&Math.abs(d.position.y-ps.y-1.2)<2.2){d.visible=false;save.drops.push(d.userData.i);sfx("drop");
      burstHearts(d.position.clone().setY(ps.y),3);save.mood=Math.min(1,save.mood+.05);
      if(save.stage===0)save.stage=1;
      const n=save.drops.length;toast(n<10?`Goccia Aero ${n}/10`:"Tutte le Gocce! Torna da VEGA");
      if(n>=5&&!save.droneCaught&&!dr.active)startDrone();
      if(n>=10&&save.stage<3&&(save.droneCaught||!dr.active))save.stage=3;
      persist();hud();}});

  // pet AI
  const near=drops.filter(d=>d.visible).map(d=>({d,dist:Math.hypot(d.position.x-pt.x,d.position.z-pt.z)})).sort((a,b)=>a.dist-b.dist)[0];
  const dp=Math.hypot(ps.x-pt.x,ps.z-pt.z);
  pt.timer-=dt;pt.barkCd-=dt;
  if(pt.state!=="happy"){
    if(dr.active&&Math.hypot(drone.position.x-pt.x,drone.position.z-pt.z)<14){pt.state="chase";pt.target={x:drone.position.x,z:drone.position.z};}
    else if(near&&near.dist<13&&Math.hypot(near.d.position.x-ps.x,near.d.position.z-ps.z)<20){pt.state="sniff";pt.target={x:near.d.position.x,z:near.d.position.z};}
    else if(dp>3.2){pt.state="follow";pt.target={x:ps.x,z:ps.z};}
    else if(pt.state!=="sit"&&pt.state!=="zoom"&&ps.speed<.5){pt.state=Math.random()<.004?"zoom":"sit";pt.timer=3;}
    if(pt.state==="zoom"&&pt.timer<=0)pt.state="sit";
  } else if(pt.timer<=0) pt.state="sit";
  let tx=pt.x,tz=pt.z,sp=0;
  if(pt.state==="follow"){tx=ps.x-Math.sin(ps.yaw)*1.8+Math.cos(ps.yaw)*1.2;tz=ps.z-Math.cos(ps.yaw)*1.8-Math.sin(ps.yaw)*1.2;sp=Math.min(9,2+dp*1.4);}
  else if(pt.state==="sniff"){tx=pt.target.x;tz=pt.target.z;sp=6.5;const dd=Math.hypot(tx-pt.x,tz-pt.z);if(dd<1.8){sp=0;if(pt.barkCd<=0){sfx("bark");pt.hop=1;pt.barkCd=1.6;}}}
  else if(pt.state==="chase"){tx=pt.target.x;tz=pt.target.z;sp=7;if(pt.barkCd<=0){sfx("bark");pt.hop=1;pt.barkCd=1.2;}}
  else if(pt.state==="zoom"){const a=T*3;tx=ps.x+Math.cos(a)*3;tz=ps.z+Math.sin(a)*3;sp=8;}
  const ddx=tx-pt.x,ddz=tz-pt.z,dl=Math.hypot(ddx,ddz);
  if(sp>0&&dl>.3){let nx=pt.x+ddx/dl*Math.min(sp*dt,dl),nz=pt.z+ddz/dl*Math.min(sp*dt,dl);[nx,nz]=collide(nx,nz);pt.x=nx;pt.z=nz;
    const ty=Math.atan2(ddx,ddz);let df=ty-pt.yaw;df=Math.atan2(Math.sin(df),Math.cos(df));pt.yaw+=df*Math.min(1,dt*10);pt.speed=sp;}
  else{pt.speed*=.85;if(pt.state==="sit"||pt.state==="happy"){const ty=Math.atan2(ps.x-pt.x,ps.z-pt.z);let df=ty-pt.yaw;df=Math.atan2(Math.sin(df),Math.cos(df));pt.yaw+=df*Math.min(1,dt*4);}}
  pt.hop=Math.max(0,pt.hop-dt*2.5);
  const sitting=(pt.state==="sit"&&pt.speed<.3)?1:0;pt.sit+=(sitting-pt.sit)*Math.min(1,dt*5);
  const pgy=groundAt(pt.x,pt.z);
  pet.position.set(pt.x,pgy+Math.sin(pt.hop*Math.PI)*.6+(pt.state==="happy"?Math.abs(Math.sin(T*12))*.25:0),pt.z);pet.rotation.y=pt.yaw;
  const tw=Math.min(1,pt.speed/6),tp=T*16;
  petLegs.forEach((l,i)=>{l.rotation.x=Math.sin(tp+(i%2?Math.PI:0)+(i>1?Math.PI:0))*.8*tw;});
  petLegs[2].rotation.x+=-pt.sit*1.2;petLegs[3].rotation.x+=-pt.sit*1.2;pb.position.y=.62-pt.sit*.15;pb.rotation.x=-pt.sit*.35;band.position.y=pb.position.y;
  petHead.rotation.z=Math.sin(T*1.3)*.15*(1-tw);petHead.rotation.y=(pt.state==="sit"?Math.sin(T*.7)*.4:0);petHead.position.y=1.05-pt.sit*.05;
  ears.forEach((e,i)=>e.rotation.x=Math.sin(T*(pt.state==="happy"?18:3)+i)*.2);
  petTail.position.x=Math.sin(T*(pt.state==="happy"||pt.state==="sniff"?20:5))*.12;
  const blink=Math.sin(T*1.1)>.985?.15:1;eyes.forEach(e=>e.scale.y=1.3*blink);
  save.mood=Math.max(.15,save.mood-dt*.004);

  // VEGA idle
  vega.position.y=PAV.y+.1+Math.sin(T*1.6)*.05;const tv=Math.atan2(ps.x-vega.position.x,ps.z-vega.position.z);let dv=tv-vega.rotation.y;dv=Math.atan2(Math.sin(dv),Math.cos(dv));vega.rotation.y+=dv*Math.min(1,dt*2);
  vega.userData.visor.material.emissiveIntensity=1.2+Math.sin(T*3)*.4;

  // drone
  if(dr.active){dr.t+=dt;const a=dr.t*.55;drone.position.set(dr.cx+Math.sin(a)*11+Math.sin(a*2.3)*4,height(dr.cx,dr.cz)+3+Math.sin(dr.t*1.7)*1.2,dr.cz+Math.cos(a*1.3)*11);
    drone.rotation.y=a;drone.userData.rotors.forEach(r=>r.rotation.y+=dt*40);
    if(Math.hypot(drone.position.x-ps.x,drone.position.z-ps.z)<2.4&&(ps.y+2.6>drone.position.y)){catchDrone();}}

  // context buttons
  $("talkBtn").hidden=!(Math.hypot(ps.x-vega.position.x,ps.z-vega.position.z)<4.2);
  if($("talkBtn").hidden&&!$("talk").hidden){$("talk").hidden=true;document.body.classList.remove("talking");}
  $("petBtn").hidden=!(dp<3.2);

  // ambient
  bubbles.forEach(b=>{b.position.y+=b.userData.v*dt;b.position.x+=Math.sin(T+b.userData.ph)*dt*.3;if(b.position.y>24){b.position.y=0;}});
  windU.value=T;
  palms.forEach(p=>{const u=p.userData;u.crown.rotation.z=Math.sin(T*.9+u.ph)*.05;u.crown.rotation.x=Math.cos(T*.7+u.ph)*.04;
    u.fronds.forEach(f=>{f.rotation.z=f.userData.tilt+Math.sin(T*2.2+f.userData.ph)*.05;});});
  for(let i=hearts.length-1;i>=0;i--){const h=hearts[i];h.userData.t+=dt;h.position.addScaledVector(h.userData.v,dt);h.material.opacity=1-h.userData.t/1.4;if(h.userData.t>1.4){scene.remove(h);hearts.splice(i,1);}}
  for(let i=fireworks.length-1;i>=0;i--){const f=fireworks[i];f.userData.t+=dt;const p=f.geometry.attributes.position;
    for(let j=0;j<p.count;j++){const v=f.userData.vel[j];v.y-=4*dt;v.multiplyScalar(.985);p.setXYZ(j,p.getX(j)+v.x*dt,p.getY(j)+v.y*dt,p.getZ(j)+v.z*dt);}
    p.needsUpdate=true;f.material.opacity=Math.max(0,1-f.userData.t/2.2);if(f.userData.t>2.2){scene.remove(f);f.geometry.dispose();fireworks.splice(i,1);}}

  // camera
  const dist=$("talk").hidden?10:6.5;
  tmp.set(ps.x+Math.sin(camYaw)*Math.cos(camPitch)*dist,ps.y+1.6+Math.sin(camPitch)*dist,ps.z+Math.cos(camYaw)*Math.cos(camPitch)*dist);
  tmp.y=Math.max(tmp.y,groundAt(tmp.x,tmp.z)+.8);
  camPos.lerp(tmp,Math.min(1,dt*(reduced?3:6)));camera.position.copy(camPos);camera.lookAt(ps.x,ps.y+1.6,ps.z);
  {const tx=Math.round(ps.x/.5)*.5,tz=Math.round(ps.z/.5)*.5;sun.target.position.set(tx,0,tz);sun.position.copy(skyU.sunDir.value).multiplyScalar(70).add(sun.target.position);}
  sky.position.copy(camera.position);

  if(composer)composer.render(dt);else renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
function startDrone(){dr.active=true;dr.t=0;dr.cx=-12;dr.cz=10;drone.visible=true;toast("Un drone ribelle sta rubando la luce!",3800);hud();}
function catchDrone(){dr.active=false;drone.visible=false;save.droneCaught=true;sfx("win");burstHearts(pet.position,8);save.mood=Math.min(1,save.mood+.25);
  toast(`Drone catturato! ${save.pet} è fierissimo`,3800);for(let i=0;i<3;i++)firework(ps.x+(Math.random()-.5)*8,ps.y+12,ps.z+(Math.random()-.5)*8);
  if(save.drops.length>=10&&save.stage<3)save.stage=3;persist();hud();}
// strumenti per i test (attivi solo con ?debug nell'indirizzo)
if(location.search.includes("debug"))window.__game={ps,pt,save,dr,setNight,startDrone,setPhase,bloom,finalPass,sun,hemi,scene,renderer,M,PH,lin,
  setTod:k=>{phase=Math.round(k);isNight=phase===2;tod=k;applyTod(k);updateEnv(k,true);},cam:(y,p)=>{camYaw=y;camPitch=p;}};
linearize(scene);applyTod(0);updateEnv(0,true);
// resume a saved drone mission
if(save.drops.length>=5&&!save.droneCaught)startDrone();
hud();
requestAnimationFrame(tick);
})();
</script>
